<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | بيض أبو نبهان</title><meta name="description" content="لوحة تحكم"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#6b3510">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css"></head><body><div class="top"><div class="wrap"><a class="brand" href="index.html"><img src="favicon.svg" alt="" width="34" height="34">لوحة التحكم</a><nav><a href="index.html">رجوع للموقع</a></nav></div></div>
<main class="wrap">
<section id="login" hidden><h2>دخول صاحب المحل</h2><div class="panel"><p style="margin:0">اضغط الزرار وهيوصلك لينك دخول على الإيميل بتاعك. افتحه من نفس الجهاز.</p><div class="btns"><button class="btn primary" id="sendlink">ابعتلي لينك الدخول</button></div><p class="status" id="loginstatus" role="status"></p></div></section>
<div id="dash" hidden>
<div class="btns" style="justify-content:flex-start"><button class="btn sm" id="logout">خروج</button></div>
<section><h2>سعر النهارده</h2><div class="panel"><p style="margin:0">اكتب سعر البورصة للكرتونة وهامشك. اللوحة تحسب سعر البيع، وزرار النشر بيظهره في الصفحة الرئيسية على طول.</p>
<div class="grid3"><div><label for="b_red">بورصة بيض أحمر</label><input type="number" id="b_red" inputmode="numeric"></div><div><label for="b_white">بورصة بيض أبيض</label><input type="number" id="b_white" inputmode="numeric"></div><div><label for="b_baladi">بورصة بيض بلدي</label><input type="number" id="b_baladi" inputmode="numeric"></div></div>
<label for="margin">هامشك في الكرتونة (جنيه)</label><input type="number" id="margin" inputmode="numeric">
<dl id="sell"></dl><div class="msg" id="morning"></div><div class="btns"><button class="btn green" id="publish">انشر السعر على الموقع</button><button class="btn" id="copymorning">انسخ رسالة الصبح</button></div><p class="status" id="pubstatus" role="status"></p><p class="note" id="current"></p></div></section>
<section><h2>الطلبات</h2><div class="panel"><dl id="stats"></dl><div id="orders"></div><div class="btns"><button class="btn sm" id="reload">حدّث</button></div></div></section>
<section><h2>العملاء</h2><div class="panel"><dl id="customers"></dl></div></section></div></main>
<script src="config.js"></script><script src="site.js"></script><script src="dash.js"></script></body></html>
